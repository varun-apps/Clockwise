# ClockWise task orchestrator — requires go-task (https://taskfile.dev)
#   macOS: brew install go-task/tap/go-task
# Every task also has a raw pnpm equivalent, so `task` is a convenience, not a
# hard dependency.
version: "3"

env:
  API_DIR: apps/api
  WEB_DIR: apps/web

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  install:
    desc: Install all dependencies (pnpm)
    cmds:
      - pnpm install

  up:
    desc: Start Postgres (and optional Langfuse) via docker-compose
    cmds:
      - docker compose up -d

  down:
    desc: Stop docker-compose services
    cmds:
      - docker compose down

  api:
    desc: Run the Node/Hono API dev server (hot reload)
    cmds:
      - cd {{.API_DIR}} && pnpm dev

  web:
    desc: Run the Vite dev server
    cmds:
      - pnpm --filter @clockwise/web dev

  codegen:
    desc: Dump the OpenAPI schema and regenerate the typed TS client
    cmds:
      - cd {{.API_DIR}} && pnpm exec tsx src/openapi-export.ts ../../openapi.json
      - pnpm run codegen

  lint:
    desc: Lint both stacks (Biome)
    cmds:
      - pnpm run lint

  format:
    desc: Format both stacks (Biome)
    cmds:
      - pnpm run format

  typecheck:
    desc: Type-check both stacks
    cmds:
      - pnpm run api:typecheck
      - pnpm run web:typecheck

  test:
    desc: Run backend tests (offline, on injected test doubles)
    cmds:
      - pnpm run api:test

